[package]
name = "rexporter"
version = "0.1.0"
edition = "2021"
description = "A lightweight Prometheus host-metrics exporter — node_exporter, but Rust, zero async runtime"
license = "MIT"
authors = ["Animesh Raj <animesh080808@gmail.com>"]
repository = "https://github.com/itsarraj/rexporter"
readme = "README.md"
keywords = ["prometheus", "metrics", "node-exporter", "monitoring"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "rexporter"
path = "src/lib.rs"

[[bin]]
name = "rexporter"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
